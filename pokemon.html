<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon API - Pokédex</title>
    <link rel="stylesheet" href="pokemon.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="back-button">← Volver al inicio</a>
            <h1>⚪ Pokédex</h1>
            <p>Explore all Pokémon from all generations!</p>
        </div>
    </header>

    <main class="container">
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Pokémon by name or number...">
                <button id="searchBtn">Search</button>
            </div>
            <div class="filter-box">
                <button id="showAllBtn" class="active">Show All Pokémon</button>
                <select id="typeFilter">
                    <option value="">All Types</option>
                    <option value="normal">Normal</option>
                    <option value="fire">Fire</option>
                    <option value="water">Water</option>
                    <option value="electric">Electric</option>
                    <option value="grass">Grass</option>
                    <option value="ice">Ice</option>
                    <option value="fighting">Fighting</option>
                    <option value="poison">Poison</option>
                    <option value="ground">Ground</option>
                    <option value="flying">Flying</option>
                    <option value="psychic">Psychic</option>
                    <option value="bug">Bug</option>
                    <option value="rock">Rock</option>
                    <option value="ghost">Ghost</option>
                    <option value="dragon">Dragon</option>
                    <option value="dark">Dark</option>
                    <option value="steel">Steel</option>
                    <option value="fairy">Fairy</option>
                </select>
                <button id="loadMoreBtn" style="display: none;">Load More</button>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading Pokémon...</p>
        </div>

        <div id="error" class="error" style="display: none;">
            <p>Oops! Something went wrong. Try again!</p>
            <button id="retryBtn">Try Again</button>
        </div>

        <div id="pokemonGrid" class="pokemon-grid"></div>
    </main>

    <footer>
        <div class="container">
            <p>Data provided by <a href="https://pokeapi.co/" target="_blank">PokéAPI</a></p>
            <p>Made with ❤️ for Pokémon trainers</p>
        </div>
    </footer>

    <script src="pokemon.js"></script>
</body>
</html>
